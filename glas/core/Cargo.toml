[package]
name = "glas-core"
version = "0.1.0"
edition = "2021"
description = "Glas dialogue core — turn state machine, sessions, skills (no Qt, host-testable)"
license = "MIT"
publish = false

[lib]
name = "glas_core"
path = "src/lib.rs"

[[bin]]
name = "glas-cli"
path = "src/bin/glas_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
