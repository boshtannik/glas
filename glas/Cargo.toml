[package]
name = "glas"
version = "0.1.0"
edition = "2021"
description = "Glas — голосовой ассистент управления телефоном для Sailfish OS"
license = "MIT"
publish = false

[lib]
name = "glas"
path = "src/lib.rs"

[[bin]]
name = "harbour-glas"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
qmetaobject = { path = "vendor/qmetaobject-sfos-rs/qmetaobject" }
sailors = { path = "vendor/sailors" }
cpal = { version = "0.15", optional = true }
hound = { version = "3", optional = true }

[features]
default = []
voice = ["dep:cpal", "dep:hound"]

[profile.release]
opt-level = "s"
